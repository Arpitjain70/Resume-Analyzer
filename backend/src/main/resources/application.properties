# =========================================================
# ATS Resume Analyzer - Application Configuration
# =========================================================

# ─── Server ───────────────────────────────────────────────
# The port your Spring Boot server listens on.
# Frontend will call: http://localhost:8080/api/...
server.port=8080

# ─── Database (Supabase PostgreSQL) ──────────────────────
# Connected to Supabase project: etphrdefuljkbxlwbstj
spring.datasource.url=jdbc:postgresql://db.etphrdefuljkbxlwbstj.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=R2puP78QZV8heQ7l
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────
# hibernate.ddl-auto options:
#   create      → drops all tables and recreates them on startup (loses data!)
#   update      → only adds new columns/tables, never deletes (safe for dev)
#   validate    → checks schema matches entities, throws error if not
#   none        → does nothing (use in production)
# We use 'update' for development so our tables are created automatically.
spring.jpa.hibernate.ddl-auto=update

# Shows the SQL queries Hibernate generates in the console.
# Very helpful for learning! Set to false in production.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate we are using PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── File Upload ──────────────────────────────────────────
# Maximum size for a single uploaded file (5 MB)
spring.servlet.multipart.max-file-size=5MB
# Maximum size for the entire request (same as file limit)
spring.servlet.multipart.max-request-size=5MB

# ─── JWT ──────────────────────────────────────────────────
# Secret key used to sign and verify JWT tokens.
# IMPORTANT: In production, use a long random string (256-bit minimum)
# and store it in environment variables, NOT in this file.
jwt.secret=atsResumeAnalyzerSecretKeyForJWTSigningPleaseChangeInProduction2024
# Token expiration in milliseconds: 86400000 = 24 hours
jwt.expiration=86400000

# ─── File Storage ─────────────────────────────────────────
# Folder where uploaded PDF resumes will be stored locally.
# Windows: change to something like C:/uploads/resumes
# The app will create this folder if it doesn't exist.
app.upload.dir=./uploads/resumes

# ─── Gemini AI ────────────────────────────────────────────
# Your Google Gemini API key. Get it from:
# https://aistudio.google.com/app/apikey
# NEVER commit a real API key to version control!
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# ─── CORS ─────────────────────────────────────────────────
# Allow the React dev server (port 5173) to call our API
app.cors.allowed-origins=http://localhost:5173,https://arpitjain70.github.io

# ─── Logging ──────────────────────────────────────────────
# Shows more details from our own code (com.ats package)
logging.level.com.ats=DEBUG
